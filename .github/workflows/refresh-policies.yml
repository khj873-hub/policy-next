name: 기업마당 데이터 갱신

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 KST 10:00 (UTC 01:00)
  workflow_dispatch:      # GitHub UI에서 수동 실행 가능

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 기업마당 데이터 갱신
        run: node scripts/fetch-policies.mjs
        env:
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/policies-cache.json
          git diff --staged --quiet || git commit -m "chore: 기업마당 정책 데이터 갱신 $(date +'%Y-%m-%d')"
          git push
